<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <defs>
    <linearGradient id="infinity-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E5E5EA" />
      <stop offset="50%" stop-color="#8E8E93" />
      <stop offset="75%" stop-color="#D1D1D6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <!-- Infinity symbol -->
  <path d="M 22 40 C 22 26, 40 26, 48 40 C 56 54, 74 54, 74 40 C 74 26, 56 26, 48 40 C 40 54, 22 54, 22 40 Z" 
        fill="none" 
        stroke="url(#infinity-silver)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <!-- Wordmark -->
  <text x="96" y="49" fill="url(#infinity-silver)" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="6">INFINITY</text>
</svg>
