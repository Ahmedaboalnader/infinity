  <rect width="100" height="100" rx="20" fill="#0A0A0B" />
  <path d="M 30 50 C 30 38, 44 38, 50 50 C 56 62, 70 62, 70 50 C 70 38, 56 38, 50 50 C 44 62, 30 62, 30 50 Z" 
